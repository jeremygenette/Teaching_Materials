# decks/_metadata.yml
#
# Quarto merges a directory's _metadata.yml into every document rendered
# from that folder, regardless of project type. This is where the KU
# Leuven revealjs config actually lives: a project-level `format:
# revealjs:` block in ../_quarto.yml does NOT reach these files, because
# this is a `project: type: book` project and decks/*.qmd are not book
# chapters.
#
# Every deck's own YAML front matter only needs `format: revealjs` (no
# options) - everything below is merged in automatically. Paths are
# relative to THIS file's folder (decks/), so one extra `../` compared to
# ../_quarto.yml.

format:
  revealjs:
    embed-resources: true
    theme: [simple, ../../_shared/styles/kuleuven-reveal.scss]
    slide-number: true
    incremental: true
    number-sections: true
    transition: fade
    loop: true
    hide-inactive-cursor: true
    preview-links: true
    pdf-separate-fragments: true
    scrollable: true
    width: 1100
    height: 700
    margin: 0.08
    min-scale: 0.2
    max-scale: 1.5
    auto-stretch: true
    footer: "<span id='slide-path'>📁 Root</span>"
    include-after-body:
      - ../../_shared/styles/after-body.html
