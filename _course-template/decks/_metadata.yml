# decks/_metadata.yml
#
# NOTE: this file is now a harmless backup, not the source of truth. It
# turned out Quarto book projects (project: type: book) may not reliably
# merge even directory-level _metadata.yml into files that aren't listed
# book chapters, same as they don't merge project-level `format:` from
# ../_quarto.yml. So every deck now carries its full KU Leuven revealjs
# config directly in its own YAML front matter (see decks/full-deck.qmd
# etc., and scripts/build_deck.R which generates it automatically for new
# decks) - that's guaranteed to apply regardless of any project/directory
# metadata quirks, since it's the document's own settings.
#
# This file is left in place in case a future Quarto version does merge
# it correctly (in which case it's redundant but not harmful - document
# front matter always wins over it anyway).

format:
  revealjs:
    embed-resources: true
    theme: [simple, ../../_shared/styles/kuleuven-reveal.scss]
    slide-number: true
    incremental: true
    number-sections: true
    transition: fade
    loop: true
    hide-inactive-cursor: true
    preview-links: true
    pdf-separate-fragments: true
    scrollable: true
    width: 1100
    height: 700
    margin: 0.08
    min-scale: 0.2
    max-scale: 1.5
    auto-stretch: true
    footer: "<span id='slide-path'>📁 Root</span>"
    include-after-body:
      - ../../_shared/styles/after-body.html
